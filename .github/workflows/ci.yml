name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests eval scripts
      - run: pytest -q
      - name: Offline evaluation report (quick)
        run: mcaa-eval --quick --out results/ci
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: results/ci
